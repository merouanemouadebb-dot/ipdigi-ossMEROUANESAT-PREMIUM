
name: MEROUANESAT Cinema Intro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cinema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install orchestral audio engine
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth fluid-soundfont-gm ffmpeg

      - name: Compose original cinematic music
        run: |
          python3 <<'PY'
          import struct

          events = []

          def event(t, data):
              events.append((round(t * 960), bytes(data)))

          def note(ch, key, start, duration, velocity):
              event(start, [0x90 + ch, key, velocity])
              event(start + duration, [0x80 + ch, key, 0])

          def program(ch, instrument, volume, pan):
              event(0, [0xC0 + ch, instrument])
              event(0, [0xB0 + ch, 7, volume])
              event(0, [0xB0 + ch, 10, pan])
              event(0, [0xB0 + ch, 91, 65])

          program(0, 48, 100, 42)
          program(1, 61, 115, 82)
          program(2, 47, 110, 64)
          program(3, 60, 105, 55)
          program(4, 52, 85, 64)
          program(5, 14, 80, 75)

          chords = [
              (0.0, 2.4, [38, 45, 50, 53]),
              (2.4, 2.0, [34, 41, 46, 53]),
              (4.4, 2.0, [36, 43, 48, 55]),
              (6.4, 3.1, [38, 45, 50, 57, 62]),
          ]

          for start, duration, keys in chords:
              for key in keys:
                  note(0, key, start, duration, 82)
                  note(4, key + 12, start, duration, 52)

          melody = [
              (1.0, 50, .75),
              (1.8, 57, .65),
              (2.5, 58, .85),
              (3.4, 65, .85),
              (4.4, 60, .65),
              (5.1, 67, .65),
              (5.8, 69, .55),
              (6.4, 74, 2.8),
          ]

          for start, key, duration in melody:
              note(3, key, start, duration, 94)

              if start >= 4.4:
                  note(1, key, start, duration, 102)

              note(5, key + 12, start, .5, 55)

          for start in [
              .3, 1.2, 2.4, 3.4,
              4.4, 4.9, 5.4, 5.9, 6.4
          ]:
              note(2, 38, start, .55, 110)
              note(9, 36, start, .3, 108)

          for start in [
              4.4, 4.65, 4.9, 5.15,
              5.4, 5.65, 5.9, 6.15
          ]:
              note(9, 38, start, .15, 82)

          note(9, 49, 6.4, 2.5, 118)
          note(9, 57, 6.4, 2.5, 105)

          for key in [38, 45, 50, 57, 62]:
              note(1, key, 6.4, 2.8, 108)

          event(10, [0xFF, 0x2F, 0x00])

          def vlq(n):
              out = [n & 127]
              n >>= 7

              while n:
                  out.insert(0, (n & 127) | 128)
                  n >>= 7

              return bytes(out)

          track = bytearray()
          previous = 0

          for tick, data in sorted(events, key=lambda x: x[0]):
              track.extend(vlq(tick - previous))
              track.extend(data)
              previous = tick

          header = b'MThd' + struct.pack(
              '>IHHH', 6, 0, 1, 480
          )

          with open('/tmp/premium.mid', 'wb') as f:
              f.write(header)
              f.write(b'MTrk')
              f.write(struct.pack('>I', len(track)))
              f.write(track)
          PY

          SOUND_FONT=$(find /usr/share/sounds -name 'FluidR3_GM.sf2' -print -quit)
          test -n "$SOUND_FONT"

          fluidsynth -ni \
            -F /tmp/premium.wav \
            -r 44100 \
            -g 0.8 \
            "$SOUND_FONT" \
            /tmp/premium.mid

          mkdir -p assets/icon

          ffmpeg -y \
            -i /tmp/premium.wav \
            -t 10 \
            -af "afade=t=in:d=0.2,afade=t=out:st=9:d=1" \
            -b:a 192k \
            assets/icon/premium_cinema.mp3

      - name: Create cinematic animation
        run: |
          cat > lib/premium_intro.dart <<'DART'
          import 'dart:async';
          import 'dart:math' as math;

          import 'package:flutter/material.dart';
          import 'package:media_kit/media_kit.dart';

          const _gold = Color(0xFFD4AF37);
          const _light = Color(0xFFFFEAB0);

          class PremiumIntro extends StatefulWidget {
            final Widget child;

            const PremiumIntro({
              super.key,
              required this.child,
            });

            @override
            State<PremiumIntro> createState() =>
                _PremiumIntroState();
          }

          class _PremiumIntroState extends State<PremiumIntro>
              with SingleTickerProviderStateMixin,
                   WidgetsBindingObserver {
            late final AnimationController _controller;
            final _finished = Completer<void>();

            bool _visible = true;
            bool _started = false;
            Timer? _fallback;

            @override
            void initState() {
              super.initState();

              WidgetsBinding.instance.addObserver(this);

              _controller = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 10),
              );

              _controller.addStatusListener((status) {
                if (status == AnimationStatus.completed) {
                  _finish();
                }
              });
            }

            @override
            void didChangeDependencies() {
              super.didChangeDependencies();

              if (_started) return;
              _started = true;

              if (MediaQuery.disableAnimationsOf(context)) {
                _visible = false;
                return;
              }

              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (!mounted || !_visible) return;

                _fallback = Timer(
                  const Duration(seconds: 2),
                  _startAnimation,
                );

                unawaited(_playMusic());
              });
            }

            void _startAnimation() {
              if (!mounted || !_visible) return;

              _fallback?.cancel();

              if (!_controller.isAnimating &&
                  _controller.value == 0) {
                _controller.forward();
              }
            }

            Future<void> _playMusic() async {
              Player? player;

              try {
                final audio = Player();
                player = audio;

                await audio.open(
                  Media('asset:///assets/icon/premium_cinema.mp3'),
                  play: false,
                );

                await audio.setVolume(75);

                if (!mounted ||
                    !_visible ||
                    _controller.value > 0.08) {
                  return;
                }

                _startAnimation();

                await audio.play();
                await _finished.future;
              } catch (_) {
                _startAnimation();
              } finally {
                try {
                  await player?.dispose();
                } catch (_) {}
              }
            }

            void _finish() {
              if (!mounted || !_visible) return;

              _fallback?.cancel();
              _controller.stop();

              if (!_finished.isCompleted) {
                _finished.complete();
              }

              setState(() => _visible = false);
            }

            @override
            void didChangeAppLifecycleState(
              AppLifecycleState state,
            ) {
              if (state == AppLifecycleState.paused) {
                _finish();
              }
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _fallback?.cancel();

              if (!_finished.isCompleted) {
                _finished.complete();
              }

              _controller.dispose();
              super.dispose();
            }

            double phase(double t, double a, double b) {
              return ((t - a) / (b - a))
                  .clamp(0.0, 1.0)
                  .toDouble();
            }

            Widget metalText(
              String value,
              double size,
              double sweep, {
              double spacing = 1.2,
            }) {
              return ShaderMask(
                blendMode: BlendMode.srcIn,
                shaderCallback: (rect) {
                  return LinearGradient(
                    begin: Alignment(sweep - 1, -1),
                    end: Alignment(sweep + 1, 1),
                    colors: const [
                      Color(0xFF805415),
                      Color(0xFFD4AF37),
                      Color(0xFFFFF3D1),
                      Colors.white,
                      Color(0xFFC59630),
                      Color(0xFF805415),
                    ],
                  ).createShader(rect);
                },
                child: Text(
                  value,
                  maxLines: 1,
                  textDirection: TextDirection.ltr,
                  textAlign: TextAlign.center,
                  style: TextStyle(
                    color: Colors.white,
                    fontSize: size,
                    fontWeight: FontWeight.w900,
                    letterSpacing: spacing,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Stack(
                fit: StackFit.expand,
                children: [
                  ExcludeFocus(
                    excluding: _visible,
                    child: IgnorePointer(
                      ignoring: _visible,
                      child: widget.child,
                    ),
                  ),

                  if (_visible)
                    AnimatedBuilder(
                      animation: _controller,
                      builder: (context, _) {
                        final t = _controller.value * 10;

                        final logo = Curves.easeOutCubic.transform(
                          phase(t, 1.0, 3.4),
                        );

                        final name = Curves.easeOutCubic.transform(
                          phase(t, 3.0, 5.1),
                        );

                        final premium = Curves.easeOutCubic.transform(
                          phase(t, 5.6, 7.1),
                        );

                        final beam = Curves.easeOutCubic.transform(
                          phase(t, 4.4, 6.4),
                        );

                        final fade = 1 - phase(t, 9.2, 10);

                        final sweep =
                            -3 + phase(t, 4, 8.7) * 6;

                        return Opacity(
                          opacity: fade,
                          child: Material(
                            color: Colors.black,
                            child: Stack(
                              fit: StackFit.expand,
                              children: [
                                CustomPaint(
                                  painter: _CinemaLight(t),
                                ),

                                SafeArea(
                                  child: Center(
                                    child: Padding(
                                      padding:
                                          const EdgeInsets.all(24),
                                      child: FittedBox(
                                        fit: BoxFit.scaleDown,
                                        child: SizedBox(
                                          width: 680,
                                          height: 470,
                                          child: Column(
                                            mainAxisAlignment:
                                                MainAxisAlignment.center,
                                            children: [
                                              Opacity(
                                                opacity: logo,
                                                child: Transform.scale(
                                                  scale:
                                                      2.1 - logo * 1.1,
                                                  child: Container(
                                                    width: 142,
                                                    height: 142,
                                                    decoration:
                                                        BoxDecoration(
                                                      borderRadius:
                                                          BorderRadius
                                                              .circular(36),
                                                      border: Border.all(
                                                        color: _gold,
                                                        width: 2.5,
                                                      ),
                                                      gradient:
                                                          const LinearGradient(
                                                        begin:
                                                            Alignment.topLeft,
                                                        end:
                                                            Alignment.bottomRight,
                                                        colors: [
                                                          Color(0xFF382810),
                                                          Color(0xFF080808),
                                                          Color(0xFF17120A),
                                                        ],
                                                      ),
                                                      boxShadow: [
                                                        BoxShadow(
                                                          color: _gold
                                                              .withValues(
                                                            alpha: logo * .4,
                                                          ),
                                                          blurRadius: 65,
                                                          spreadRadius: 4,
                                                        ),
                                                      ],
                                                    ),
                                                    child: const Icon(
                                                      Icons.play_arrow_rounded,
                                                      size: 108,
                                                      color: _light,
                                                    ),
                                                  ),
                                                ),
                                              ),

                                              const SizedBox(height: 42),

                                              Opacity(
                                                opacity: name,
                                                child: Transform.scale(
                                                  scale:
                                                      1.5 - name * .5,
                                                  child: metalText(
                                                    'MEROUANESAT',
                                                    65,
                                                    sweep,
                                                    spacing: 2,
                                                  ),
                                                ),
                                              ),

                                              const SizedBox(height: 18),

                                              Container(
                                                width: 630 * beam,
                                                height: 3,
                                                decoration: BoxDecoration(
                                                  gradient:
                                                      const LinearGradient(
                                                    colors: [
                                                      Colors.transparent,
                                                      _gold,
                                                      Colors.white,
                                                      _gold,
                                                      Colors.transparent,
                                                    ],
                                                  ),
                                                  boxShadow: [
                                                    BoxShadow(
                                                      color:
                                                          _gold.withValues(
                                                        alpha: beam * .65,
                                                      ),
                                                      blurRadius: 30,
                                                    ),
                                                  ],
                                                ),
                                              ),

                                              const SizedBox(height: 24),

                                              Opacity(
                                                opacity: premium,
                                                child: Transform.translate(
                                                  offset: Offset(
                                                    0,
                                                    22 * (1 - premium),
                                                  ),
                                                  child: metalText(
                                                    'PREMIUM',
                                                    35,
                                                    sweep,
                                                    spacing: 15,
                                                  ),
                                                ),
                                              ),

                                              const SizedBox(height: 30),

                                              Opacity(
                                                opacity: premium,
                                                child: const Text(
                                                  'BEYOND ENTERTAINMENT',
                                                  textDirection:
                                                      TextDirection.ltr,
                                                  style: TextStyle(
                                                    color: Colors.white70,
                                                    fontSize: 15,
                                                    letterSpacing: 5,
                                                    fontWeight:
                                                        FontWeight.w500,
                                                  ),
                                                ),
                                              ),
                                            ],
                                          ),
                                        ),
                                      ),
                                    ),
                                  ),
                                ),

                                Positioned(
                                  right: 16,
                                  bottom: 12,
                                  child: SafeArea(
                                    child: TextButton.icon(
                                      autofocus: true,
                                      onPressed: _finish,
                                      icon: const Icon(
                                        Icons.skip_next_rounded,
                                        color: _gold,
                                      ),
                                      label: const Text(
                                        'Skip intro',
                                        style: TextStyle(
                                          color: Colors.white54,
                                        ),
                                      ),
                                    ),
                                  ),
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
                ],
              );
            }
          }

          class _CinemaLight extends CustomPainter {
            final double time;

            _CinemaLight(this.time);

            @override
            void paint(Canvas canvas, Size size) {
              if (size.isEmpty) return;

              final center = size.center(Offset.zero);
              final rect = Offset.zero & size;

              final radius = size.longestSide * .7;

              final impact =
                  math.exp(-math.pow((time - 6.4) / .5, 2));

              final glow =
                  (.08 + impact * .18).toDouble();

              canvas.drawRect(
                rect,
                Paint()
                  ..shader = RadialGradient(
                    colors: [
                      _gold.withValues(alpha: glow),
                      Colors.black,
                    ],
                  ).createShader(rect),
              );

              final random = math.Random(37);

              for (int i = 0; i < 100; i++) {
                final angle =
                    random.nextDouble() * math.pi * 2;

                final seed = random.nextDouble();
                final speed =
                    .12 + random.nextDouble() * .18;

                final p =
                    (seed + time * speed) % 1.0;

                final distance =
                    (1 - p) * radius;

                final direction = Offset(
                  math.cos(angle),
                  math.sin(angle),
                );

                final head =
                    center + direction * distance;

                final tail = center +
                    direction *
                        (distance + 8 + 60 * (1 - p));

                final opacity =
                    (math.sin(p * math.pi) * .42)
                        .clamp(0.0, 1.0)
                        .toDouble();

                final paint = Paint()
                  ..strokeWidth =
                      .5 + random.nextDouble() * 1.6
                  ..strokeCap = StrokeCap.round
                  ..color = _gold.withValues(
                    alpha: opacity,
                  );

                canvas.drawLine(head, tail, paint);
              }

              final orbitOpacity =
                  (math.sin(time / 10 * math.pi) * .20)
                      .clamp(0.0, 1.0)
                      .toDouble();

              for (int i = 0; i < 3; i++) {
                final orbit =
                    size.shortestSide * (.30 + i * .09);

                final oval = Rect.fromCenter(
                  center: center,
                  width: orbit * 2,
                  height: orbit * .9,
                );

                canvas.save();
                canvas.translate(center.dx, center.dy);
                canvas.rotate(
                  time * .12 + i * math.pi / 3,
                );
                canvas.translate(-center.dx, -center.dy);

                canvas.drawArc(
                  oval,
                  time * .65 + i,
                  math.pi * 1.3,
                  false,
                  Paint()
                    ..style = PaintingStyle.stroke
                    ..strokeWidth = 1.2
                    ..color = _gold.withValues(
                      alpha: orbitOpacity,
                    ),
                );

                canvas.restore();
              }

              final lineAlpha =
                  (impact * .55).toDouble();

              canvas.drawRect(
                Rect.fromCenter(
                  center: center,
                  width: size.width,
                  height: 2,
                ),
                Paint()
                  ..shader = LinearGradient(
                    colors: [
                      Colors.transparent,
                      _gold.withValues(alpha: lineAlpha),
                      Colors.transparent,
                    ],
                  ).createShader(rect),
              );
            }

            @override
            bool shouldRepaint(
              covariant _CinemaLight oldDelegate,
            ) {
              return oldDelegate.time != time;
            }
          }
          DART

      - name: Replace previous intro safely
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/app.dart')
          s = p.read_text()

          marker = '// MEROUANESAT CINEMATIC INTRO V2'

          if marker not in s:
              raise RuntimeError(
                  'Previous V2 intro not found. No changes saved.'
              )

          s = s.split(marker, 1)[0].rstrip() + '\n'

          if s.count('return _CinemaIntro(') != 1:
              raise RuntimeError('Unexpected app builder')

          s = s.replace(
              'return _CinemaIntro(',
              'return PremiumIntro('
          )

          for line in [
              "import 'dart:async';",
              "import 'dart:io';",
              "import 'dart:math' as math;",
              "import 'dart:typed_data';",
              "import 'package:flutter/foundation.dart';",
              "import 'package:media_kit/media_kit.dart';",
              "import 'package:path_provider/path_provider.dart';",
          ]:
              s = s.replace(line + '\n', '')

          s = "import 'premium_intro.dart';\n" + s

          if 'assets/icon/' not in Path('pubspec.yaml').read_text():
              raise RuntimeError('Audio asset directory missing')

          p.write_text(s)
          PY

      - name: Verify files
        run: |
          test -s assets/icon/premium_cinema.mp3
          test -s lib/premium_intro.dart
          git diff --check

      - name: Save cinematic intro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app.dart
          git add lib/premium_intro.dart
          git add assets/icon/premium_cinema.mp3
          git commit -m "MEROUANESAT Premium Cinematic Final"
          git push origin HEAD:main
