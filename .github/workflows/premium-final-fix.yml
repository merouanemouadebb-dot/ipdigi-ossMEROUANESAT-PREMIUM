
name: MEROUANESAT Final Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Premium improvements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('lib/features')
          page = root / 'live_tv/presentation/live_tv_page.dart'
          hero = root / 'live_tv/presentation/live_hero_carousel.dart'
          vod = root / 'vod/presentation/movie_category_hero.dart'

          def once(s, old, new):
              if s.count(old) != 1:
                  raise RuntimeError('Unexpected source: ' + old[:100])
              return s.replace(old, new, 1)

          p = page.read_text()

          p = once(p, '    final isWide = MediaQuery.of(context).size.width >= 720;', '''    final isWide = MediaQuery.of(context).size.width >= 720;
              if (!isWide && !PlatformInfo.isTv) {
                return Padding(
                  padding: const EdgeInsets.fromLTRB(12, 6, 12, 10),
                  child: Row(
                    children: [
                      for (final entry in <(_LiveTab, String)>[
                        (_LiveTab.discover, 'live.tabDiscover'),
                        (_LiveTab.channels, 'live.tabChannels'),
                        (_LiveTab.schedule, 'live.tabSchedule'),
                      ])
                        Expanded(
                          child: Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 2),
                            child: TextButton(
                              onPressed: () => onChanged(entry.$1),
                              style: TextButton.styleFrom(
                                backgroundColor: tab == entry.$1
                                    ? AppColors.accent : AppColors.surface,
                                foregroundColor: tab == entry.$1
                                    ? Colors.black : AppColors.textSecondary,
                                padding: const EdgeInsets.symmetric(horizontal: 4),
                                minimumSize: const Size(0, 44),
                              ),
                              child: FittedBox(
                                fit: BoxFit.scaleDown,
                                child: Text(ref.tr(entry.$2),
                                  style: const TextStyle(fontSize: 13,
                                    fontWeight: FontWeight.w700)),
                              ),
                            ),
                          ),
                        ),
                    ],
                  ),
                );
              }''')

          p = once(p, '''    return Column(
                children: [
                  LiveHeroCarousel(liveChannels: items),
                  const SizedBox(height: 8),''', '''    final mobile = !PlatformInfo.isTv &&
                  MediaQuery.sizeOf(context).width < 720;
              return Column(
                children: [
                  if (!mobile) LiveHeroCarousel(liveChannels: items),
                  if (!mobile) const SizedBox(height: 8),''')

          p = once(p, '            itemAspectRatio: 16 / 11,', '''            itemAspectRatio: mobile ? 1.0 : 16 / 11,
                      headerSlotBuilder: mobile
                          ? (context, selection) => LiveHeroCarousel(liveChannels: items)
                          : null,''')

          p = once(p, '''                          widget.item.displayName,
                                    maxLines: 1,''', '''                          widget.item.displayName,
                                    textAlign: TextAlign.center,
                                    maxLines: 2,''')

          h = hero.read_text()

          h = once(h, '      height: _kHeroHeight,', '''      height: MediaQuery.sizeOf(context).width < 720
                    ? 232.0 + ((MediaQuery.textScalerOf(context).scale(14) / 14 - 1)
                        * 120).clamp(0.0, 160.0).toDouble()
                    : _kHeroHeight,''')

          h = once(h, '    final progress = p.progressAt(now);', '''    final progress = p.progressAt(now);
              if (MediaQuery.sizeOf(context).width < 720) {
                return Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 6),
                  child: DecoratedBox(
                    decoration: BoxDecoration(
                      color: palette,
                      borderRadius: BorderRadius.circular(14),
                    ),
                    child: Padding(
                      padding: const EdgeInsets.all(12),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(children: [
                            if (c.logoUrl != null) ...[
                              SizedBox(width: 40, height: 32,
                                child: CachedNetworkImage(
                                  imageUrl: c.logoUrl!,
                                  fit: BoxFit.contain,
                                  errorWidget: (_, _, _) =>
                                      const Icon(Icons.live_tv))),
                              const SizedBox(width: 8),
                            ],
                            Expanded(child: Text(c.displayName,
                              maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(color: Colors.white,
                                fontSize: 12, fontWeight: FontWeight.w700))),
                            const SizedBox(width: 6),
                            Text(ref.tr('live.badge'),
                              style: const TextStyle(
                                color: Colors.white,
                                fontSize: 11,
                                fontWeight: FontWeight.w900,
                                backgroundColor: Colors.redAccent)),
                          ]),
                          const SizedBox(height: 8),
                          Expanded(child: Align(
                            alignment: Alignment.centerLeft,
                            child: Text(title, maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(color: Colors.white,
                                fontSize: 18, fontWeight: FontWeight.w800)),
                          )),
                          if (desc.isNotEmpty)
                            Flexible(child: Text(desc, maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(color: Colors.white70,
                                fontSize: 12))),
                          const SizedBox(height: 6),
                          Row(children: [
                            Expanded(child: ElevatedButton(
                              onPressed: onPlay,
                              style: ElevatedButton.styleFrom(
                                backgroundColor: AppColors.accent,
                                foregroundColor: Colors.black,
                                minimumSize: const Size(0, 42),
                                padding: const EdgeInsets.symmetric(horizontal: 4)),
                              child: FittedBox(fit: BoxFit.scaleDown,
                                child: Text(ref.tr('common.watch'))),
                            )),
                            const SizedBox(width: 8),
                            Expanded(child: FittedBox(fit: BoxFit.scaleDown,
                              child: Text('${_hm(p.start)} – ${_hm(p.stop)}',
                                style: const TextStyle(color: Colors.white70,
                                  fontSize: 11)))),
                          ]),
                          const SizedBox(height: 6),
                          LinearProgressIndicator(
                            value: progress,
                            minHeight: 3,
                            color: AppColors.accent,
                            backgroundColor: Colors.black38),
                        ],
                      ),
                    ),
                  ),
                );
              }''')

          v = vod.read_text()

          for before, after in [(6, '0.8'), (18, '2.0')]:
              v, n = re.subn(
                  rf'sigmaX:\s*{before}\s*,\s*sigmaY:\s*{before}\b',
                  f'sigmaX: {after}, sigmaY: {after}', v)
              if n != 1:
                  raise RuntimeError(f'Unexpected blur setting: {before}')

          for file, source in [(page, p), (hero, h), (vod, v)]:
              file.write_text(source)
              print('Updated', file)
          PY

      - name: Verify changes
        run: |
          git diff --check
          git diff --stat

      - name: Save final improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/live_tv/presentation/live_tv_page.dart
          git add lib/features/live_tv/presentation/live_hero_carousel.dart
          git add lib/features/vod/presentation/movie_category_hero.dart
          git commit -m "MEROUANESAT Premium Final Improvements"
          git push origin HEAD:main
