name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Fix ProGuard compatibility
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" android \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare secure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          python3 <<'PY'
          import os
          import base64
          from pathlib import Path

          password = os.environ["KEYSTORE_PASSWORD"]
          encoded = os.environ["KEYSTORE_BASE64"]

          if not password or not encoded:
              raise RuntimeError("Missing signing secrets")

          key = Path(os.environ["RUNNER_TEMP"]) / "merouanesat-release.jks"
          key.write_bytes(base64.b64decode(encoded, validate=True))

          def escape(value):
              data = value.encode("utf-16-be")
              return "".join(
                  "\\u" + data[i:i+2].hex()
                  for i in range(0, len(data), 2)
              )

          properties = {
              "storePassword": password,
              "keyPassword": password,
              "keyAlias": "merouanesat",
              "storeFile": str(key),
          }

          Path("android/key.properties").write_text(
              "".join(
                  f"{k}={escape(v)}\n"
                  for k, v in properties.items()
              )
          )
          print("Signing configuration ready")
          PY

      - name: Build signed APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          test -n "$SIGNER"

          "$SIGNER" verify --print-certs "$APK" > signature.txt

          EXPECTED="00cb4c990553acdd99b654a69254a864ee78181e42a23c03306d8b32278c4053"

          ACTUAL=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' signature.txt)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Signing certificate mismatch"
            exit 1
          fi

          echo "MEROUANESAT signature verified successfully"

      - name: Remove signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/merouanesat-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEROUANESAT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
