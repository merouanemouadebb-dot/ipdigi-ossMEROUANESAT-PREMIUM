
name: Build IPdigi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Fix ProGuard compatibility
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -name "build.gradle" -type f -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} +

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: MEROUANESAT-APK
          path: build/app/outputs/flutter-apk/app-release.apk
